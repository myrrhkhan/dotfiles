[profile]
id = "personal.mac"
description = "Personal Mac — full brew groups; Spotify bar widget on"

[modules]
enable = [
  "aerospace",
  "nvim",
  "iterm2",
  "zsh",
  "kitty",
  "cava",
]

[sketchybar.features]
spotify_widget = true

[brew]
groups = [
  "work-comm",
  "dev",
  "wm",
  "browsers",
  "creative",
  "leisure",
  "academic",
  "fonts",
]
default_on = []

[brew.questionnaire]
interactive = true
ui = "gum"
