[profile]
id = "work.mac"
description = "Work laptop — WM, bar, editor, terminal colors; conservative brew groups"

[modules]
enable = [
  "aerospace",
  "nvim",
  "iterm2",
  "zsh",
]

[sketchybar]
variant = "neuton"
neuton_layout = "laptop"

[sketchybar.features]
spotify_widget = false

[brew]
groups = ["work-comm", "dev", "wm", "fonts-minimal"]
default_on = [
  "slack",
  "microsoft-office",
  "microsoft-auto-update",
  "kitty",
  "raycast",
  "zed",
  "obsidian",
  "copilot-cli",
]

[brew.questionnaire]
interactive = true
ui = "gum"
